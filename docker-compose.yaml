services:
  user-service:
    image: 'adnli/user-service-iso'
    container_name: 'user-service-container'
    depends_on:
      - user-db
    ports:
      - 8001:8081
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345

  user-db:
    image: 'postgres'
    container_name: user-db-postgres
    ports:
      - 2345:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=postgres

  task-service:
    image: 'adnli/task-service-iso'
    container_name: 'task-service-container'
    depends_on:
      - task-db
    ports:
      - 8000:8080
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://task-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=54321
      - FEIGN_USER_URL=http://user-service:8080/api/user

  task-db:
    image: 'postgres'
    container_name: task-db-postgres
    ports:
      - 2346:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=54321
      - POSTGRES_DB=postgres

  minio-file-service:
    image: quay.io/minio/minio:latest
    ports:
      - 9000:9000
      - 9090:9090
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server --console-address ":9090" /data

  minio-setup:
    image: minio/mc
    depends_on:
      - minio-file-service
    environment:
      MC_HOST: http://admin:admin123@minio-file-service:9000
    entrypoint: >
      /bin/sh -c "
        echo Starting Minio ...;
        mc alias set minio http://minio-file-service:9000 admin admin123;
        mc mb minio/first-bucket;
        mc mb minio/users-photos;
        exit 0;
      "
volumes:
  minio-data: